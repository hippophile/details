<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library</title>
<link rel="stylesheet" href="/shared/shared.css">
<style>
  input[type=search] { font-size:16px; padding:8px 10px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); width:100%; }
  input[type=text].rename { font-size:16px; padding:5px 8px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); width:100%; }
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .toolbar .grow { flex:1 1 220px; }
  .btn.sm { font-size:14px; padding:6px 14px; }
  .btn.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  a.btn { text-decoration:none; display:inline-block; }
  .drop { border:2px dashed var(--line); border-radius:10px; padding:12px 16px; margin-bottom:14px; color:var(--muted); font-size:14px; }
  .drop.over { border-color:var(--accent); color:var(--fg); }
  #status { color:var(--muted); font-size:14px; margin-top:8px; }
  #status:empty { display:none; }
  #status.err { color:var(--bad); }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line); }
  td { padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  td.when { white-space:nowrap; }
  .actions .btn.sm { padding:5px 11px; }
  td.actions { max-width:260px; }
  td.title { font-weight:600; overflow-wrap:anywhere; }
  .actions .btn { margin:0 4px 4px 0; }
  audio { width:100%; min-width:240px; margin-top:8px; }
  .empty { color:var(--muted); padding:8px 0; }
  .empty a { color:var(--accent); }
  [hidden] { display:none !important; }
  dialog { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:18px; max-width:min(420px, 92vw); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  dialog .row { margin-top:14px; justify-content:flex-end; }
  @media (max-width: 699px) {
    thead { display:none; }
    table, tbody, tr, td { display:block; width:100%; }
    tr { border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-bottom:10px; background:var(--card); }
    td { border:0; padding:3px 0; text-align:left !important; }
    td[data-label]::before { content:attr(data-label) ": "; color:var(--muted); font-size:13px; }
    td.title::before { content:none; }
    td.title { font-size:17px; }
  }
</style>
</head>
<body>
<nav id="nav" aria-label="Pages"></nav>
<main>
  <h1>Library</h1>

  <div class="card">
    <div class="toolbar">
      <div class="grow">
        <label for="q" class="sr" style="position:absolute; left:-9999px">Search titles</label>
        <input type="search" id="q" placeholder="Search titles" autocomplete="off">
      </div>
      <button class="btn sm ghost" id="trashToggle" type="button" aria-pressed="false">Trash</button>
      <button class="btn sm" id="importBtn" type="button">Import file</button>
      <input type="file" id="file" accept="audio/*,video/*,.m4a,.mp3,.wav,.flac,.ogg,.mp4,.mov,.mkv,.webm" hidden>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </div>

  <div class="drop" id="drop">Drop an audio or video file here to import it (kept as-is, a 16 kHz mono copy is made for analysis).</div>

  <div class="card" id="listCard">
    <h2 id="listTitle">Recordings</h2>
    <table id="tbl">
      <thead><tr><th>Title</th><th>Date</th><th class="num">Length</th><th class="num">Size</th><th class="num">Runs</th><th>Actions</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No recordings yet. <a href="/record">Record one</a> or import a file.</div>
  </div>
</main>

<dialog id="confirmDlg" aria-labelledby="confirmMsg">
  <div id="confirmMsg"></div>
  <div class="row">
    <button class="btn sm ghost" id="confirmNo" type="button">Cancel</button>
    <button class="btn sm bad" id="confirmYes" type="button">Move to trash</button>
  </div>
</dialog>

<script src="/shared/nav.js"></script>
<script src="/library/library.js"></script>
</body>
</html>

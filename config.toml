# Defaults only, no secrets. Override with DETAILS_<SECTION>_<KEY> env vars or .env (git-ignored).
[server]
port = 8765                       # PORT is accepted as an alias

[paths]
data_dir = "~/details-data"
hf_hub = "~/.cache/huggingface/hub"   # HF_HOME/hub wins when HF_HOME is set
# prompts_dir: where prompts/<kind>/vN.md are read and new versions are saved. Default: the repo's prompts/ folder.
# Set DETAILS_PATHS_PROMPTS_DIR (absolute path) to use another folder, e.g. in tests.

[lmstudio]
url = "http://localhost:1234"
cli = "~/.lmstudio/bin/lms"
exclusive = false                 # true = the app may also unload LM Studio models it did not load
unload_on_terminal = true         # a failed or cancelled analysis unloads the model the app loaded (never the user's own)

[db]                              # url / url_test come from DATABASE_URL / DATABASE_URL_TEST
url = ""
url_test = ""
connect_timeout = 5

[record]
sample_rate = 16000               # browser must capture at this rate (no resampling anywhere)
sync_interval_s = 5               # WAV header patch + fsync interval while recording
grace_s = 60                      # seconds a dropped take waits for a resume before auto-finalizing
keep_wav = false                  # keep rec.wav next to master.flac
min_free_gb = 2                   # refuse to start below this much free disk
max_msg_mb = 1                    # WebSocket max message size
ffmpeg = ""                       # empty = look up on PATH
ffprobe = ""
tz = "Europe/Athens"              # DETAILS_TZ is accepted as an alias; used by the v1 importer

[trash]
days = 30                         # trashed recordings are purged after this many days (>= 1)

[import]
max_mb = 2048                     # Library import upload cap

[models]
path = "models.toml"              # model registry; relative to the repo root

[runner]
heartbeat_timeout_s = 120         # a child process silent for this long is killed and its job fails
cancel_grace_s = 5                # SIGTERM -> SIGKILL delay when cancelling
log_max_lines = 5000              # job log cap (lines); then one "log truncated" line and nothing more

[stt]
window_s = 30                     # audio is transcribed in windows of this many seconds (checkpoint + resume unit)
vocab_hint = "Συνάντηση για AI adoption, agents, local LLM, RAG, embeddings, PostgreSQL, pgvector, MCP, AI Act, GDPR, Azure OpenAI, Docker, CI/CD, GitHub Actions, pull request, sprint, .NET, Blazor, KPIs, Jira, backlog."
plugins = ""                      # extra engine modules for the worker (comma-separated)

[llm]                             # the LM Studio URL stays in [lmstudio] url
single_pass_max_tokens = 20000    # transcripts estimated above this are processed in chunks (also capped by the model's context)
chunk_tokens = 8000               # estimated tokens per chunk (estimate, not measured)
chunk_overlap_tokens = 200        # whole segments repeated at the start of the next chunk
chars_per_token = 2.5             # estimate for Greek, not measured; real usage.prompt_tokens is stored per run
timeout_s = 900                   # one chat call
max_tokens_debrief = 2000
max_tokens_notes = 2000
max_tokens_checklist = 1500
max_tokens_tags = 400
stream = true                     # DETAILS_LLM_STREAM: replies are streamed so the page shows them as they are written
stream_idle_timeout_s = 60        # a streamed call fails after this long without any bytes (replaces timeout_s for it)

[live]                            # Live assist on /record (DETAILS_LIVE_<KEY>); models are ids from models.toml
stt_model = "whisper-turbo"       # must be an installed `fast` speech model (the large model is refused in live mode)
llm_model = "gemma-cheap"         # must have role `cheap`: the 26B is never loaded while recording
language = "el"
notes_every_min = 2               # rolling notes/action items/tags every N minutes (0.5 to 30)
partials = true                   # grey partial line while talking
max_backlog_s = 60                # live audio waiting for the speech worker; older live audio is dropped, never the WAV
max_transcript_tokens = 4000      # newest transcript sent to the notes model (estimate, not measured; E4B context is 8192)
llm_timeout_s = 90                # one notes call (and one model load)
stt_timeout_s = 30                # one speech reply (after the worker said ready)
stt_load_timeout_s = 120          # cold start of the speech worker
vocab_hint = false                # send [stt] vocab_hint to Whisper
